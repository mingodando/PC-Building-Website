{% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
{% else %}
    <div class="image-placeholder" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="{{ size|default:56 }}" height="{{ size|default:56 }}"><rect x="16" y="16" width="32" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="25" y="25" width="14" height="14" rx="2" fill="currentColor" opacity=".35"/><path d="M24 8v8M32 8v8M40 8v8M24 48v8M32 48v8M40 48v8M8 24h8M8 32h8M8 40h8M48 24h8M48 32h8M48 40h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span>{{ product.category.name }}</span>
    </div>
{% endif %}
